<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>0acam Discord Server Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap">
<style>
:root{
  --bg:#000000; --text:#f2f4f8; --soft:rgba(255,255,255,.65);
  --glass:rgba(255,255,255,.06); --glass-hover:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --accent:#7cc4ff; --on-accent:#04132e;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:#000}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  display:flex; justify-content:center; padding:56px 20px;
}
#snow{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
main{position:relative; z-index:1; width:100%; max-width:440px}
header{text-align:center; margin-bottom:34px}
.logo-lg{
  width:96px; height:96px; margin:0 auto 18px; border-radius:50%; overflow:hidden;
  background:var(--glass); border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.7);
}
.logo-lg img{display:block; width:100%; height:100%; object-fit:cover}
h1{margin:0 0 8px; font-size:clamp(1.8rem,8vw,2.3rem); line-height:1.1; font-weight:800; letter-spacing:-.03em}
header p{margin:0 auto; color:var(--soft); font-size:1rem; max-width:32ch; line-height:1.5}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.card{
  display:flex; align-items:center; gap:14px; padding:14px 16px; text-decoration:none; color:var(--text);
  background:var(--glass); border:1px solid var(--line); border-radius:22px;
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  transition:background .2s ease, transform .2s ease, border-color .2s ease;
}
a.card:hover{background:var(--glass-hover); border-color:rgba(255,255,255,.24); transform:translateY(-2px)}
a.card:active{transform:scale(.985)}
a.card:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.icon{
  flex:none; width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
  background:linear-gradient(145deg,#2f6fd6,#0f2f78); border:1px solid rgba(255,255,255,.18);
  box-shadow:0 6px 14px rgba(0,0,0,.5);
}
.icon svg{width:30px; height:30px; fill:#fff}
.text{flex:1; min-width:0}
.name{display:block; font-weight:800; font-size:1.05rem; letter-spacing:-.01em}
.desc{display:block; color:var(--soft); font-size:.88rem; margin-top:2px; font-weight:500}
.join{
  flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--accent); color:var(--on-accent); transition:transform .2s ease;
}
a.card:hover .join{transform:translateX(3px)}
.join svg{width:18px; height:18px}
footer{margin-top:30px; text-align:center; color:var(--soft); font-size:.85rem}
@media (prefers-reduced-motion: reduce){ a.card,.join{transition:none} }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="logo-lg">
      <img src="https://cdn.discordapp.com/avatars/969044763162599424/d3a6b803da67ac2d97c0b1636b28c6fe.webp?size=1536" alt="0acam avatar" width="96" height="96" referrerpolicy="no-referrer">
    </div>
    <h1>0acam Discord Server Links</h1>
    <p>Pick a server and jump in.</p>
  </header>
  <ul id="links"></ul>
  <footer>Invite not working? Message 0acam on Discord.</footer>
</main>
<script>
// Edit this list: swap each url for your real invite link.
const servers = [
  { name: "Main Server",   desc: "Chat, clips and announcements", url: "https://discord.gg/your-invite" },
  { name: "Community Hub", desc: "Hang out and meet the crew",    url: "https://discord.gg/your-invite" },
  { name: "Gaming Squad",  desc: "Find people to play with",      url: "https://discord.gg/your-invite" },
  { name: "Support",       desc: "Questions, help and feedback",  url: "https://discord.gg/your-invite" }
];
const logo = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>';
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const list = document.getElementById("links");
servers.forEach(s => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", "Join " + s.name);
  const icon = document.createElement("span"); icon.className = "icon"; icon.innerHTML = logo;
  const text = document.createElement("span"); text.className = "text";
  const n = document.createElement("span"); n.className = "name"; n.textContent = s.name;
  const d = document.createElement("span"); d.className = "desc"; d.textContent = s.desc;
  text.append(n, d);
  const j = document.createElement("span"); j.className = "join"; j.innerHTML = arrow;
  a.append(icon, text, j); li.append(a); list.append(li);
});

// Falling snow
(function(){
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, flakes = [];
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(160, Math.floor(w * h / 9000));
    flakes = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*2.6+.8,
      v: Math.random()*.9+.4, d: Math.random()*Math.PI*2, a: Math.random()*.4+.25
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for (const f of flakes){
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fillStyle = "rgba(255,255,255," + f.a + ")"; ctx.fill();
      if (!still){
        f.d += .01; f.y += f.v; f.x += Math.sin(f.d) * .5;
        if (f.y > h + 5){ f.y = -5; f.x = Math.random()*w; }
      }
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { resize(); if (still) draw(); });
  resize(); draw();
})();
</script>
</body>
</html>
